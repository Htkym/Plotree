name: CI

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Run unit tests
        run: dotnet test .\tests\Plotree.Tests\Plotree.Tests.csproj -p:Platform=x64

      - name: Verify control-statement formatting
        shell: pwsh
        env:
          Platform: x64
        run: |
          dotnet restore tools/Plotree.Site/Plotree.Site.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($project in @('src/Plotree/Plotree.csproj', 'tests/Plotree.Tests/Plotree.Tests.csproj', 'tools/Plotree.Site/Plotree.Site.csproj')) {
            dotnet format style $project --diagnostics IDE2001 --no-restore --verify-no-changes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            dotnet format whitespace $project --no-restore --verify-no-changes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
