name: Bug report
description: Report behavior that differs from the expected result.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Plotree. Do not include project files that contain private story material.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plotree version or commit
      placeholder: e.g. 1.0.0 or abc1234
    validations:
      required: true
  - type: dropdown
    id: windows-version
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10
        - Other
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add screenshots or logs after removing any private story content.
